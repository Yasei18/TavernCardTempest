    <style>
        .pb-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 2rem 0;
        }
        @media (min-width: 640px) { .pb-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .pb-grid { grid-template-columns: repeat(4, 1fr); } }

        .pb-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            padding: 0 1rem;
            border: 1px solid #d5dae6;
            border-radius: 10px;
            background: #f4f6fb;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .pb-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #1c2c7c 0%, #3a5098 100%);
            z-index: 0;
            transition: opacity 0.2s;
        }
        .pb-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(28, 44, 124, 0.25);
        }
        .pb-card:hover::before {
            opacity: 0.85;
        }
        .pb-card span {
            position: relative;
            z-index: 1;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
